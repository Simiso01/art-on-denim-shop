name: build

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: PHP syntax
        run: find . -name "*.php" -not -path "./android/*" -print0 | xargs -0 -n1 php -l

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --no-daemon
